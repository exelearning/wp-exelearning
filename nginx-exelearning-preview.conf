# eXeLearning — nginx hardening for the opaque HTTP preview store
#
# SECURITY: block direct web access to the ephemeral editor-preview session
# store. ExeLearning_Preview_Serving_Controller serves those bytes through an
# opaque-origin capability URL (the authless REST route) with a sandbox CSP.
#
# The store lives under wp-content/uploads/exelearning-preview/, which the web
# server serves as static files. On Apache the store drops a `.htaccess`
# "Require all denied" guard on first use — but nginx does NOT read .htaccess,
# so without this rule a direct GET to a materialized preview document
# (…/uploads/exelearning-preview/{id}/revisions/{n}/documents/*.html) would
# return untrusted author HTML SAME-ORIGIN and WITHOUT the sandbox CSP — a
# second, un-sandboxed serving path that defeats the opaque-origin isolation.
#
# Include this from your site's `server { … }` block, e.g.:
#     include /path/to/wp-content/plugins/exelearning/nginx-exelearning-preview.conf;
#
# Default WordPress layout (wp-content/uploads at the site root). For a
# subdirectory install or a relocated uploads dir (UPLOADS / WP_CONTENT_DIR,
# multisite), adjust the prefix to the real uploads URL path. The `^~` prefix
# match takes precedence over the static-file regex locations in a typical WP
# vhost, so the deny is not short-circuited.

location ^~ /wp-content/uploads/exelearning-preview/ {
    return 403;
}
