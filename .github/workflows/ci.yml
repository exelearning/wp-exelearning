---
name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  push:
    tags:
      - '*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Codecov authenticates with OIDC instead of a token kept as a secret.
  # Without this permission no identity token can be issued, and uploads from
  # a protected branch are rejected.
  id-token: write

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # === PHP SETUP ===
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer:v2
          coverage: none

      # === NODE SETUP ===
      # Pinned, not inherited from the runner image: vite (via Vitest) declares
      # engines ^20.19.0 || >=22.12.0, so whatever ubuntu-latest happens to ship
      # is not a guarantee. `cache: npm` keys on package-lock.json.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # === CACHING ===
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-${{ hashFiles('package-lock.json') }}

      # === INSTALL DEPENDENCIES ===
      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium firefox

      # === TRANSLATIONS (no WordPress runtime needed; fail fast before wp-env) ===
      # The i18n audit and generated-file contract run against the bundled
      # WP-CLI (vendor/bin/wp, on PATH via Composer) and gettext, so they are
      # cheap and gate the pipeline before the WordPress environment is started.
      - name: WordPress i18n audit
        run: |
          set -o pipefail
          composer i18n-audit 2>&1 | tee "${RUNNER_TEMP}/i18n-audit.log"
          if grep -q '::error' "${RUNNER_TEMP}/i18n-audit.log"; then
            echo "::error::WordPress i18n audit reported errors. See annotations above."
            exit 1
          fi

      - name: Check translation consistency
        # Fails on untranslated strings, a broken runtime translation contract,
        # or stale committed PO/POT sources. MO and JSON runtime files are
        # generated and validated locally but remain ignored by Git.
        run: make check-translations

      # === LINT (fail fast before slow tests) ===
      - name: Run code linting (PHPCS)
        run: ./vendor/bin/phpcs --standard=.phpcs.xml.dist -q .

      # Regression guard for the uploads exclude-pattern: scan a copy of the
      # tree nested under a wp-content/uploads/exelearning/ parent directory.
      # An absolute-type pattern matches that checkout location itself and
      # silently excludes every file (exit 0, zero files checked), so assert
      # the nested copy is actually scanned. checkout-index, not git archive:
      # .gitattributes export-ignores dotfiles, including .phpcs.xml.dist.
      - name: PHPCS exclude-pattern regression guard
        run: |
          nested="${RUNNER_TEMP}/wp-content/uploads/exelearning/plugin"
          mkdir -p "${nested}"
          git checkout-index --all --prefix="${nested}/"
          checked=$(./vendor/bin/phpcs --standard="${nested}/.phpcs.xml.dist" --report=json -q "${nested}" | jq '.files | length')
          echo "PHPCS checked ${checked} file(s) in the nested checkout"
          test "${checked}" -gt 0

      # === JS UNIT TESTS (no WordPress runtime needed; fail fast before wp-env) ===
      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: artifacts/coverage-js/lcov.info
          flags: javascript
          # Without this the uploader also sweeps up the PHP reports left in
          # artifacts/ and files both suites under the same flag.
          disable_search: true

      # === START ENVIRONMENT (with Xdebug for coverage) ===
      - name: Start wp-env with coverage
        run: npx wp-env start --xdebug=coverage

      - name: Run plugin check
        run: make check-plugin

      # === TESTS WITH COVERAGE ===
      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Extract coverage percentage
        id: coverage
        if: always()
        run: |
          if [ -f artifacts/coverage/coverage.txt ]; then
            COVERAGE=$(grep -oP 'Lines:\s+\K[\d.]+(?=%)' artifacts/coverage/coverage.txt | head -1 || echo "0")
            echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
            # Determine badge color based on coverage
            if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
              echo "color=brightgreen" >> $GITHUB_OUTPUT
            elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
              echo "color=yellow" >> $GITHUB_OUTPUT
            elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
              echo "color=orange" >> $GITHUB_OUTPUT
            else
              echo "color=red" >> $GITHUB_OUTPUT
            fi
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/coverage/coverage.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^\s*(Lines|Functions|Classes|Methods):" artifacts/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY || echo "No coverage data"
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run E2E tests
        run: make test-e2e
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # === ARTIFACTS ===
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/html/
          retention-days: 30

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: artifacts/
          retention-days: 7

      # === UPLOAD COVERAGE TO CODECOV ===
      # OIDC, not a token: no CODECOV_TOKEN secret is configured, and uploads
      # from the protected main branch are rejected without credentials.
      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: artifacts/coverage/clover.xml
          flags: php
          # The uploader otherwise also picks up artifacts/coverage/coverage.txt,
          # a human-readable summary it cannot parse as a coverage report.
          disable_search: true
