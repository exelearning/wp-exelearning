---
name: Fix package Makefile

on:
  push:
    branches:
      - build-mo-files-during-release
    paths:
      - '.github/workflows/fix-package-makefile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build-mo-files-during-release

      - name: Update Makefile
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('Makefile')
          text = path.read_text()

          text = text.replace(
              '# Full, deterministic translation build: POT, PO, MO and JS JSON.\n'
              '# Running this twice must leave the working tree unchanged.\n',
              '# Full, deterministic translation build: POT, PO, MO and JS JSON.\n'
              '# Running this twice must leave tracked translation files unchanged.\n',
          )

          check_pattern = re.compile(
              r'# Validate that the committed translation artifacts are complete, consistent\n'
              r'# and up to date\. Fails on untranslated strings, a broken JSON contract, stale\n'
              r'# generated files \(tracked or untracked\) or non-deterministic generation\.\n'
              r'check-translations:\n'
              r'.*?'
              r'\t@echo "Translations are up to date and deterministic\."\n',
              re.DOTALL,
          )
          check_replacement = '''# Validate that committed translation sources are complete and up to date.\n# Runtime MO and JSON files are regenerated and validated but remain ignored.\ncheck-translations:\n\t@composer untranslated || { \\\n\t\techo ""; \\\n\t\techo "ERROR: Untranslated strings found. Translate them in languages/*.po."; \\\n\t\texit 1; \\\n\t}\n\tcomposer make-translations\n\tcomposer make-translations\n\tcomposer validate-translations\n\t@if ! git diff --quiet -- languages; then \\\n\t\techo ""; \\\n\t\techo "ERROR: Committed translation files are out of date."; \\\n\t\techo "Run 'make translations' and commit the tracked changes under languages/."; \\\n\t\tgit --no-pager diff --stat -- languages; \\\n\t\texit 1; \\\n\tfi\n\t@untracked="$$(git ls-files --others --exclude-standard -- languages)"; \\\n\tif [ -n "$$untracked" ]; then \\\n\t\techo ""; \\\n\t\techo "ERROR: Unexpected untracked translation files detected:"; \\\n\t\techo "$$untracked"; \\\n\t\texit 1; \\\n\tfi\n\t@echo "Translations are up to date and deterministic."\n'''
          text, count = check_pattern.subn(check_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace check-translations target')

          package_marker = '# Generate the exelearning-X.X.X.zip package\npackage:\n'
          package_replacement = '''# Generate and validate runtime translation files for packaging.\npackage-translations: mo json\n\tcomposer validate-translations\n\t@set -e; \\\n\tfound=0; \\\n\tfor po in languages/exelearning-*.po; do \\\n\t\tif [ ! -e "$$po" ]; then continue; fi; \\\n\t\tfound=1; \\\n\t\tlocale="$${po#languages/exelearning-}"; \\\n\t\tlocale="$${locale%.po}"; \\\n\t\tmo="$${po%.po}.mo"; \\\n\t\tif [ ! -s "$$mo" ]; then \\\n\t\t\techo "Error: Missing or empty generated translation file: $$mo" >&2; \\\n\t\t\texit 1; \\\n\t\tfi; \\\n\t\tjson_found=0; \\\n\t\tfor json in languages/exelearning-"$$locale"-*.json; do \\\n\t\t\tif [ ! -e "$$json" ]; then continue; fi; \\\n\t\t\tjson_found=1; \\\n\t\t\tif [ ! -s "$$json" ]; then \\\n\t\t\t\techo "Error: Empty generated translation file: $$json" >&2; \\\n\t\t\t\texit 1; \\\n\t\t\tfi; \\\n\t\tdone; \\\n\t\tif [ "$$json_found" -eq 0 ]; then \\\n\t\t\techo "Error: No generated JSON translation found for locale $$locale" >&2; \\\n\t\t\texit 1; \\\n\t\tfi; \\\n\tdone; \\\n\tif [ "$$found" -eq 0 ]; then \\\n\t\techo "Error: No translation source files found under languages/." >&2; \\\n\t\texit 1; \\\n\tfi\n\n# Generate the exelearning-X.X.X.zip package\npackage: package-translations\n'''
          if package_marker not in text:
              raise SystemExit('Could not find package target')
          text = text.replace(package_marker, package_replacement, 1)

          text = text.replace(
              '  package            - Create ZIP package. Usage: make package VERSION=x.y.z',
              '  package            - Generate translations and create ZIP. Usage: make package VERSION=x.y.z',
          )

          path.write_text(text)
          Path('makefile').unlink(missing_ok=True)
          Path('.github/workflows/fix-package-makefile.yml').unlink()
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate runtime translations from package target"
          git push