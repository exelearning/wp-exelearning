---
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release label for package name (e.g. 1.2.3 or 1.2.3-beta)"
        required: false
        default: ""
      editor_repo_url:
        description: "Editor source repository URL"
        required: false
        default: "https://github.com/exelearning/exelearning.git"
      editor_ref:
        description: "Editor ref value (main, branch name, or tag)"
        required: false
        default: "main"
      editor_ref_type:
        description: "Type of editor ref"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - branch
          - tag

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; keep the write token off disk while the
          # editor build installs third-party packages.
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set environment variables
        # Dispatch inputs are read through env, never expanded into the script,
        # and validated before they reach GITHUB_ENV (a newline there would
        # define arbitrary variables for every later step).
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release_tag }}
          INPUT_REPO_URL: ${{ github.event.inputs.editor_repo_url }}
          INPUT_REF: ${{ github.event.inputs.editor_ref }}
          INPUT_REF_TYPE: ${{ github.event.inputs.editor_ref_type }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            RAW_TAG="${GITHUB_REF##*/}"
            VERSION_TAG="${RAW_TAG#v}"
            echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV
            echo "EXELEARNING_EDITOR_REPO_URL=https://github.com/exelearning/exelearning.git" >> $GITHUB_ENV
            # Build the editor from the matching editor tag so the embedded
            # editor reports the final release version (not a nightly/alpha build).
            echo "EXELEARNING_EDITOR_REF=v${VERSION_TAG}" >> $GITHUB_ENV
            echo "EXELEARNING_EDITOR_REF_TYPE=tag" >> $GITHUB_ENV
          else
            if [ -z "$INPUT_RELEASE" ]; then
              INPUT_RELEASE="manual-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
            [[ "$INPUT_RELEASE" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::Invalid release_tag"; exit 1; }
            [[ "$INPUT_REPO_URL" =~ ^https://[0-9A-Za-z._/-]+$ ]] || { echo "::error::Invalid editor_repo_url"; exit 1; }
            [[ "$INPUT_REF" =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "::error::Invalid editor_ref"; exit 1; }
            echo "RELEASE_TAG=${INPUT_RELEASE}" >> $GITHUB_ENV
            echo "EXELEARNING_EDITOR_REPO_URL=${INPUT_REPO_URL}" >> $GITHUB_ENV
            echo "EXELEARNING_EDITOR_REF=${INPUT_REF}" >> $GITHUB_ENV
            echo "EXELEARNING_EDITOR_REF_TYPE=${INPUT_REF_TYPE}" >> $GITHUB_ENV
          fi

      - name: Build static editor
        run: make build-editor

      - name: Create package
        run: make package VERSION=${RELEASE_TAG}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: exelearning-${{ env.RELEASE_TAG }}
          path: exelearning-${{ env.RELEASE_TAG }}.zip

      - name: Build Playground URL for this release
        if: github.event_name == 'release'
        id: playground
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v${RELEASE_TAG}/exelearning-${RELEASE_TAG}.zip"
          BLUEPRINT=$(jq --arg url "$RELEASE_URL" '.steps[1].pluginData.url = $url' blueprint.json)
          ENCODED=$(echo "$BLUEPRINT" | base64 -w 0)
          echo "url=https://playground.wordpress.net/#${ENCODED}" >> $GITHUB_OUTPUT

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: exelearning-${{ env.RELEASE_TAG }}.zip
          append_body: true
          body: |

            ---

            <a href="${{ steps.playground.outputs.url }}"><img src="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/.github/playground-preview-button.svg" alt="Preview in WordPress Playground" width="224"></a>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}