---
name: Check Editor Releases

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The editor build installs third-party packages; keep the write
          # token off disk and hand it only to the push step.
          persist-credentials: false

      - name: Get latest exelearning release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest release from exelearning/exelearning
          LATEST=$(gh api repos/exelearning/exelearning/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No release found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # The tag comes from another repository and ends up in shell commands,
          # file names and a git commit: accept only a plain version tag.
          if ! [[ "$LATEST" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Unexpected editor release tag format"
            exit 1
          fi
          echo "Latest editor release: $LATEST"
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

          # Check if we already built this version
          MARKER_FILE=".editor-version"
          CURRENT=""
          if [ -f "$MARKER_FILE" ]; then
            CURRENT=$(cat "$MARKER_FILE")
          fi
          echo "Current built version: $CURRENT"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "New version available"
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2

      # `make package` needs the WP-CLI i18n command to build the runtime
      # translations and the dist-archive command to build the ZIP, both from
      # require-dev. Without this the Create package step below fails outright.
      - name: Setup PHP
        if: steps.check.outputs.found == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: steps.check.outputs.found == 'true'
        run: composer install --prefer-dist --no-progress

      - name: Build static editor
        if: steps.check.outputs.found == 'true'
        env:
          EXELEARNING_EDITOR_REPO_URL: https://github.com/exelearning/exelearning.git
          EXELEARNING_EDITOR_REF: ${{ steps.check.outputs.tag }}
          EXELEARNING_EDITOR_REF_TYPE: tag
          # Embed the final release version in the editor build (not 0.0.0-alpha).
          APP_VERSION: ${{ steps.check.outputs.tag }}
        run: make build-editor

      - name: Compute version
        if: steps.check.outputs.found == 'true'
        id: version
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create package
        if: steps.check.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make package VERSION="$VERSION"

      - name: Update editor version marker
        if: steps.check.outputs.found == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TAG" > .editor-version
          # Keep the playground blueprint's editor URL in sync with .editor-version,
          # otherwise the preview stays pinned to the hardcoded version.
          sed -i -E \
            -e "s#(release=)v[0-9][0-9A-Za-z.-]*#\1$TAG#g" \
            -e "s#(releases/download/)v[0-9][0-9A-Za-z.-]*#\1$TAG#g" \
            -e "s#(exelearning-static-)v[0-9][0-9A-Za-z.-]*(\.zip)#\1$TAG\2#g" \
            blueprint.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .editor-version blueprint.json
          git commit -m "Update editor version to $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Build Playground URL for this release
        if: steps.check.outputs.found == 'true'
        id: playground
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/exelearning-${{ steps.version.outputs.version }}.zip"
          BLUEPRINT=$(jq --arg url "$RELEASE_URL" '.steps[1].pluginData.url = $url' blueprint.json)
          ENCODED=$(echo "$BLUEPRINT" | base64 -w 0)
          echo "url=https://playground.wordpress.net/#${ENCODED}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }}"
          body: |
            Automated build with eXeLearning editor ${{ steps.version.outputs.tag }}.

            ---

            <a href="${{ steps.playground.outputs.url }}"><img src="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/.github/playground-preview-button.svg" alt="Preview in WordPress Playground" width="224"></a>
          files: exelearning-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
